[project]
name = "auto-drama-python-worker"
version = "0.1.0"
description = "AI text production worker for auto-drama-studio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aio-pika>=9.4,<10",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3"
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Python 程序通过 RabbitMQ 进行异步通信，监听并执行短剧相关的生产任务。
# 队列与交换机：它连接到 drama.tasks 交换机，
# 并在 drama.task.execute 队列中处理名为 task.execute 的路由任务。
# 使用 aio-pika 处理 RabbitMQ 的异步消息队列。
# 用 httpx 进行异步 HTTP 请求，用于调用外部模型接口或 Java 服务回调。
# 模型调用：该 Worker 负责调用文本生成模型（如 TEXT_MODEL_PROVIDER 配置为 mock，当前处于模拟阶段）。
# Prompt 调度：它内置了多种生产环节的 Prompt 版本管理，涵盖了：
# EXPANDER（扩写）、GENERATOR（生成）、QUALITY_CHECKER（质量校验）、REWRITER（重写）以及 BIBLE_EXTRACTOR（圣经/剧本大纲提取）。
# 回调机制：任务完成后，Worker 需要向指定的 Java 服务地址（JAVA_CALLBACK_BASE_URL）进行结果回调，并使用 JAVA_INTERNAL_TOKEN 进行身份验证。
# 环境依赖：项目使用 pydantic 进行高效的数据模型验证，并利用 pydantic-settings 来管理环境变量。
# 测试保障：项目配置了 pytest 和 pytest-asyncio，表明这是一个高度依赖异步测试的组件。
# 代码规范：使用了 ruff 进行代码质量控制，确保代码风格统一且高效。
