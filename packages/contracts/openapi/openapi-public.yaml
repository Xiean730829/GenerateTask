openapi: 3.1.0
info:
  title: Auto Drama Studio Public API
  version: 0.1.0
  description: >-
    Public product REST API consumed by the React web workstation (apps/web).
    Scope is the frozen MS1 subset from Issue #6 section 18 ("MS1 最小必做 API"),
    plus the task-status reads the frontend needs for polling, retry and cancel.

    Conventions:
      - All paths are prefixed with /api. Internal Worker callbacks live under
        /internal (see openapi.yaml) and MUST NOT be called by the web client.
      - Every response uses the envelope {success, data, error}. On success,
        error is null; on failure, data is null and error carries code/message.
      - Task-creating endpoints return 202 with the created GenerationTask.
      - panels/assemble and timeline/compose are synchronous Java aggregations
        (no matching taskType exists), so they return the object directly.
      - Field names are camelCase; identifiers are UUID strings.
servers:
  - url: http://localhost:8080
    description: Local development (java-api)
tags:
  - name: projects
    description: Project lifecycle and stage. (#6 §1)
  - name: materials
    description: Text/file input materials. (#6 §3)
  - name: episodes
    description: Episode listing. (#6 §2)
  - name: scripts
    description: Script generation and read. (#6 §5)
  - name: shots
    description: Shot generation and read. (#6 §6)
  - name: assets
    description: Simplified asset library. (#6 §7)
  - name: panels
    description: Panel aggregation. (#6 §8)
  - name: videos
    description: Shot video generation. (#6 §10)
  - name: audio-subtitle
    description: Voiceover and subtitle generation. (#6 §11)
  - name: timeline
    description: Timeline composition and read. (#6 §12)
  - name: exports
    description: Final MP4 export and download. (#6 §13)
  - name: tasks
    description: GenerationTask status, retry and cancel. (#6 §14)

paths:
  # ---------------------------------------------------------------- projects
  /api/projects:
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (#6 §18.1)
      description: >-
        Creates a Project and its default Episode. When sourceText is provided,
        the initial text SourceMaterial is created in the same transaction, so a
        single call bootstraps the whole single-episode quick-create workspace.
        MS1 defaults to a single-episode project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project (and default Episode, optional SourceMaterial) created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateProjectResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [projects]
      operationId: listProjects
      summary: List the current user's projects (#6 §1.2)
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: Get project detail (#6 §1.3)
      responses:
        '200':
          description: Project detail including current stage and defaultEpisodeId.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- materials
  /api/projects/{projectId}/materials/text:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [materials]
      operationId: createTextMaterial
      summary: Create a text input material (#6 §18.2)
      description: Saves a one-sentence idea, outline or script fragment as a text SourceMaterial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextMaterialRequest'
      responses:
        '201':
          description: SourceMaterial created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SourceMaterial'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- episodes
  /api/projects/{projectId}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [episodes]
      operationId: listEpisodes
      summary: List project episodes (#6 §2.1)
      description: For single-episode quick-create there is exactly one default Episode.
      responses:
        '200':
          description: Episode list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Episode'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------- scripts
  /api/episodes/{episodeId}/script-tasks:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [scripts]
      operationId: createScriptTask
      summary: Start a script generation task (#6 §18.3)
      description: >-
        Creates a script.generate GenerationTask that the Python worker consumes.
        When sourceMaterialId is omitted, the episode's project source material is used.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptTaskRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/episodes/{episodeId}/script:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [scripts]
      operationId: getEpisodeScript
      summary: Get the episode's current script (#6 §18.6)
      responses:
        '200':
          description: Current script for the episode.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Script'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- shots
  /api/scripts/{scriptId}/shot-tasks:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
    post:
      tags: [shots]
      operationId: createShotTask
      summary: Start a shot generation task (#6 §18.7)
      description: Creates a shot.generate GenerationTask that splits the script into 3-5 shots.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShotTaskRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/episodes/{episodeId}/shots:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [shots]
      operationId: listEpisodeShots
      summary: List an episode's shots (#6 §18.8)
      responses:
        '200':
          description: Shot list ordered by orderIndex.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Shot'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ assets
  /api/projects/{projectId}/asset-extract-tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [assets]
      operationId: createAssetExtractTask
      summary: Start an asset extraction task (#6 §18.9)
      description: >-
        Creates an asset.extract GenerationTask that derives character/scene/style/voice
        asset needs from the episode's shots. episodeId is required in MS1: every task must
        associate the current production Episode (see Issue #10 clarification).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetExtractTaskRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/{projectId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [assets]
      operationId: listProjectAssets
      summary: List assets referenced by the project (#6 §18.10)
      description: >-
        Returns the user-level Assets referenced by the project via AssetReference.
        A project does not own Assets; it references them.
      parameters:
        - name: type
          in: query
          required: false
          description: Optional filter by asset type.
          schema:
            $ref: '#/components/schemas/AssetType'
      responses:
        '200':
          description: Referenced asset list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ panels
  /api/episodes/{episodeId}/panels/assemble:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [panels]
      operationId: assemblePanels
      summary: Assemble shots into panels (#6 §18.11)
      description: >-
        Synchronous Java aggregation of shots into panels by TimeSpec. There is no
        panel.* taskType, so this returns the assembled panels directly rather than a task.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelAssembleRequest'
      responses:
        '200':
          description: Assembled panels.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Panel'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ------------------------------------------------------------------ videos
  /api/episodes/{episodeId}/video-tasks/batch:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [videos]
      operationId: createVideoBatchTasks
      summary: Batch-start shot video generation (#6 §18.12)
      description: >-
        Creates one video.generate GenerationTask per targeted shot. When shotIds is
        omitted, all shots in the episode are targeted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoBatchRequest'
      responses:
        '202':
          description: One GenerationTask per shot was created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------- audio-subtitle
  /api/episodes/{episodeId}/audio-subtitle-tasks:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [audio-subtitle]
      operationId: createAudioSubtitleTask
      summary: Start episode voiceover + subtitle task (#6 §18.13)
      description: Creates an audio.subtitle GenerationTask for the whole episode.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSubtitleTaskRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- timeline
  /api/episodes/{episodeId}/timeline/compose:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [timeline]
      operationId: composeTimeline
      summary: Compose the episode timeline (#6 §18.14)
      description: >-
        Synchronous Java assembly of video/audio/subtitle tracks from existing results
        into a Timeline. There is no timeline.* taskType; the async ffmpeg render happens
        later at export time via export.compose.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineComposeRequest'
      responses:
        '200':
          description: Composed timeline.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Timeline'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/episodes/{episodeId}/timeline:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [timeline]
      operationId: getEpisodeTimeline
      summary: Get the episode's current timeline (#6 §12.2)
      responses:
        '200':
          description: Current timeline.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Timeline'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------- exports
  /api/timelines/{timelineId}/exports:
    parameters:
      - $ref: '#/components/parameters/TimelineId'
    post:
      tags: [exports]
      operationId: createExport
      summary: Start a final MP4 export (#6 §18.15)
      description: >-
        Creates an Export record and its backing export.compose GenerationTask.
        Poll the returned export (or its taskId) for status.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: Export record created; render task queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Export'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [exports]
      operationId: getExport
      summary: Get export status and file info (#6 §18.16)
      responses:
        '200':
          description: Export status, file location, resolution, format and duration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Export'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [exports]
      operationId: downloadExport
      summary: Download the final video (#6 §18.17)
      description: >-
        Redirects to a short-lived signed MinIO URL for the exported MP4. The binary
        is never streamed through Postgres or served from a local path.
      responses:
        '302':
          description: Redirect to a signed object-storage URL.
          headers:
            Location:
              description: Signed, time-limited URL to the MP4 object.
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Export is not yet in a downloadable (succeeded) state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ------------------------------------------------------------------- tasks
  /api/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get a GenerationTask status (#6 §18.4 / §14.1)
      description: Primary polling endpoint. The web client polls this every 2 seconds.
      responses:
        '200':
          description: Task status, progress, error and result reference.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [tasks]
      operationId: listProjectTasks
      summary: List a project's tasks (#6 §14.2)
      responses:
        '200':
          description: Task list for the project.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{taskId}/retry:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: retryTask
      summary: Retry a failed task (#6 §14.5)
      description: >-
        Allowed only from failed. Produces a new attempt; stale callbacks from the old
        attempt are ignored by the task module.
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task is not in a retryable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Cancel a task (#6 §14.6)
      description: >-
        Cancels a pending, queued or failed task. MS1 does not support cancelling a
        running task. After cancellation, any late success/failure callback is ignored.
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task cannot be cancelled from its current state (e.g. running or terminal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TimelineId:
      name: timelineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    TaskAccepted:
      description: The GenerationTask was created and queued.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GenerationTask'
    BadRequest:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # -------- response envelope --------
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success: { const: true }
        data: {}
        error: { type: 'null' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. SCRIPT_QUALITY_CHECK_FAILED).
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    # -------- enums --------
    ProjectType:
      type: string
      description: MS1 defaults to single_episode.
      enum: [single_episode, full_series]
    # 说明：业务对象的枚举（ProjectStage / MaterialType / ScriptStatus / TaskType /
    # TaskStatus / ExportStatus）已随各业务对象抽取到 json-schema/business/ 内联定义。
    # 此处仅保留公开请求体或查询参数仍需引用的枚举，取值必须与业务 Schema 保持一致。
    AssetType:
      type: string
      description: 素材类型过滤枚举，取值与 business/asset.schema.json 保持一致。
      enum: [character, scene, style, voice]

    # -------- 业务对象 --------
    # 业务对象已抽取为独立的 JSON Schema 文件（packages/contracts/json-schema/business/），
    # 作为业务对象唯一定义来源，同时供 Python Worker 回写校验复用。此处统一通过 $ref 引用，避免重复维护。
    Project:
      $ref: ../json-schema/business/project.schema.json
    Episode:
      $ref: ../json-schema/business/episode.schema.json
    SourceMaterial:
      $ref: ../json-schema/business/source-material.schema.json
    Script:
      $ref: ../json-schema/business/script.schema.json
    Shot:
      $ref: ../json-schema/business/shot.schema.json
    Asset:
      $ref: ../json-schema/business/asset.schema.json
    Panel:
      $ref: ../json-schema/business/panel.schema.json
    Timeline:
      $ref: ../json-schema/business/timeline.schema.json
    Export:
      $ref: ../json-schema/business/export.schema.json
    GenerationTask:
      $ref: ../json-schema/business/generation-task.schema.json

    # -------- request bodies --------
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        projectType:
          allOf: [{ $ref: '#/components/schemas/ProjectType' }]
          default: single_episode
        targetDurationSeconds: { type: integer, minimum: 1, default: 60 }
        aspectRatio: { type: string, default: '9:16' }
        style: { type: [string, 'null'] }
        sourceText:
          type: [string, 'null']
          description: >-
            Optional one-sentence idea. When present, an initial text SourceMaterial is
            created together with the project and default episode.
    CreateProjectResult:
      type: object
      additionalProperties: false
      required: [project, defaultEpisode]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        defaultEpisode: { $ref: '#/components/schemas/Episode' }
        sourceMaterial:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SourceMaterial'
    CreateTextMaterialRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        title: { type: [string, 'null'] }
    ScriptTaskRequest:
      type: object
      additionalProperties: false
      properties:
        sourceMaterialId:
          type: [string, 'null']
          format: uuid
          description: Defaults to the project's source material when omitted.
    ShotTaskRequest:
      type: object
      additionalProperties: false
      properties:
        targetShotCount:
          type: [integer, 'null']
          minimum: 3
          maximum: 5
          description: Optional hint; the worker still targets 3-5 shots.
    AssetExtractTaskRequest:
      type: object
      additionalProperties: false
      required: [episodeId]
      properties:
        episodeId:
          type: string
          format: uuid
          description: Required in MS1 — the current production episode the task belongs to.
    PanelAssembleRequest:
      type: object
      additionalProperties: false
      properties:
        timeSpec:
          type: object
          additionalProperties: true
          description: Optional aggregation spec (e.g. max panel duration).
    VideoBatchRequest:
      type: object
      additionalProperties: false
      properties:
        shotIds:
          type: array
